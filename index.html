function fitGrad(root){
  // 1文字目の左端を起点に、16文字ごとに c1→c2→c1 を1周期として配置する。
  // 最後が16文字に満たない場合は、グラデーションを途中で打ち切る。
  (root||document).querySelectorAll('.gradwave-text[data-g1]').forEach(el=>{
    try{
      const tn=el.firstChild;
      if(!tn||tn.nodeType!==3)return;
      const c1=el.dataset.g1.split(',').map(Number),c2=el.dataset.g2.split(',').map(Number);
      const txt=tn.data,idx=[];
      let o=0;for(const ch of txt){idx.push(o);o+=ch.length}
      const n=idx.length;if(!n)return;
      const base=el.getBoundingClientRect();
      if(!base.width)return;
      const rg=document.createRange();
      const lenAt=i=>(i+1<n?idx[i+1]:txt.length)-idx[i];
      let top0=null,bad=false;
      const rect=i=>{rg.setStart(tn,idx[i]);rg.setEnd(tn,idx[i]+lenAt(i));const r=rg.getClientRects()[0];if(!r){bad=true;return null}return r};
      const left=i=>{const r=rect(i);if(!r)return 0;if(top0===null)top0=r.top;else if(Math.abs(r.top-top0)>3)bad=true;return r.left-base.left};
      const right=i=>{const r=rect(i);if(!r)return 0;if(top0!==null&&Math.abs(r.top-top0)>3)bad=true;return r.right-base.left};
      const xs=[];
      for(let i=0;i<n;i+=GRAD_N)xs.push([i,left(i)]);
      const xEnd=right(n-1);
      if(bad)return;
      const lerp=(a,b,t)=>a.map((v,j)=>Math.round(v*(1-t)+b[j]*t));
      const stops=[];
      for(let k=0;k<xs.length;k++){
        const [i,s]=xs[k];
        const full=i+GRAD_N<=n;
        const e=(full&&i+GRAD_N<n)?xs[k+1][1]:xEnd;
        const f=full?1:(n-i)/GRAD_N;
        const w=(e-s)/f;
        stops.push([c1,s]);
        if(f>0.5)stops.push([c2,s+w/2]);
        if(full)stops.push([c1,e]);
        else stops.push([f<=0.5?lerp(c1,c2,f/0.5):lerp(c2,c1,(f-0.5)/0.5),e]);
      }
      const px=v=>v.toFixed(2)+'px';
      el.style.backgroundImage='linear-gradient(90deg,'+stops.map(([c,x])=>rgb(c)+' '+px(x)).join(',')+')';
      el.style.backgroundSize='100% 100%';
      el.style.backgroundRepeat='no-repeat';
      el.style.backgroundPosition='0 0';
      const pb=el.parentElement;
      if(pb&&pb.classList.contains('pb')){
        const pr=pb.getBoundingClientRect();
        const off=base.left-(pr.left+pb.clientLeft);
        pb.style.backgroundImage='linear-gradient(90deg,'+stops.map(([c,x])=>autoBg(c,GRAD_BG)+' '+px(x+off)).join(',')+')';
        pb.style.backgroundSize='100% 100%';
        pb.style.backgroundRepeat='no-repeat';
        pb.style.backgroundPosition='0 0';
      }
    }catch(e){}
  });
}

function setupAutocomplete(root){
  const scope=root||document;
  scope.querySelectorAll('.ac-wrap[data-ac-target]').forEach(w=>{
    const input=w.querySelector('[data-ac-input]');
    const list=w.querySelector('[data-ac-list]');
    if(!input||!list||input.dataset.acBound)return;
    input.dataset.acBound='1';
    const close=()=>{list.classList.remove('on');list.innerHTML=''};
    const show=()=>{
      const q=input.value.trim().toLowerCase();
      const ps=[...S.players].sort((a,b)=>a.name.localeCompare(b.name));
      const hits=ps.filter(p=>!q||p.name.toLowerCase().includes(q)).slice(0,8);
      list.innerHTML=hits.length?hits.map(p=>`<button type="button" class="ac-suggestion" data-a="acPick" data-id="${p.id}">${esc(p.name)}</button>`).join(''):'<div class="ac-empty">一致するMCIDがありません</div>';
      list.classList.add('on');
    };
    input.addEventListener('input',()=>{ if(w.dataset.acTarget==='profile') profileQuery=input.value; show(); });
    input.addEventListener('focus',show);
    input.addEventListener('keydown',e=>{if(e.key==='Escape')close()});
    document.addEventListener('click',e=>{if(!w.contains(e.target))close()});
  });
}
